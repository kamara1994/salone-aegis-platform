name: aegis-backend
x-app: &app
  build:
    context: .
    dockerfile: infra/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD:?Run bootstrap first}@postgres:5432/aegis
    REDIS_URL: redis://:${REDIS_PASSWORD:?Run bootstrap first}@redis:6379/0
    OIDC_JWKS_URL: http://keycloak:8080/realms/aegis/protocol/openid-connect/certs
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_healthy}
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap first}
      POSTGRES_DB: aegis
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aegis -d aegis]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run bootstrap first}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/aegis
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: aegis
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run bootstrap first}
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: 'true'
    volumes: [./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro]
    ports: [127.0.0.1:8080:8080]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
    command: [sh, -c, 'alembic -c infra/alembic.ini upgrade head && python -m scripts.init_db']
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
  api:
    <<: *app
    ports: [127.0.0.1:8000:8000]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  orchestrator:
    <<: *app
    command: [python, -m, services.worker, --role, orchestrator]
    healthcheck: &workerhealth
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
  ai:
    <<: *app
    command: [python, -m, services.worker, --role, ai]
    healthcheck: *workerhealth
  telemetry:
    <<: *app
    command: [python, -m, services.worker, --role, telemetry]
    healthcheck: *workerhealth
  outbox:
    <<: *app
    command: [python, -m, services.worker, --role, outbox]
    healthcheck: *workerhealth
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [storage]
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: aegis-storage
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run bootstrap first}
    volumes: [objects:/data]
    ports: [127.0.0.1:9001:9001]
volumes:
  pgdata:
  redisdata:
  objects:
