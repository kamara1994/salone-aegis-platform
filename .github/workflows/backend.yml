name: backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: ruff check services scripts tests
      - run: python -c "import fastapi, httpx, jwt, redis, psycopg"
      - run: pytest -q
      - run: python -m compileall -q services scripts
  approved-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.contract_gate
      - run: VALIDATE_CONTRACTS=1 pytest tests/test_api.py -q
  compose-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.bootstrap
      - run: docker compose up --build -d
      - run: python -m scripts.smoke
      - if: always()
        run: docker compose down -v
  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile -t aegis-backend:test .
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: aegis-backend:test
          severity: CRITICAL,HIGH
          exit-code: '1'
