<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Hunting step 3: compare connection patterns</title><desc id="desc">Simulated network search results. Callouts point to the recurring destination and regular intervals with similar byte counts.</desc>
