<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Hunting step 1: alert context</title><desc id="desc">Simulated SOC alert screen. Callouts point to alert severity and source host with the time window.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6Z" fill="#ffcc4d"/></marker></defs>
  <rect width="1280" height="720" fill="#081725"/><rect width="1280" height="54" fill="#10263a"/><text x="28" y="35" fill="#eaf2fb" font-family="Arial,sans-serif" font-size="21" font-weight="700">NORTHSTAR  /  SECURITY OPERATIONS</text><text x="1000" y="34" fill="#91a9bf" font-family="Arial,sans-serif" font-size="15">SOC analyst · Training workspace</text>
  <rect y="54" width="190" height="666" fill="#0d2031"/><text x="28" y="105" fill="#829ab0" font-family="Arial,sans-serif" font-size="14">WORKSPACE</text><text x="30" y="151" fill="#eaf2fb" font-family="Arial,sans-serif" font-size="17">Overview</text><rect x="12" y="169" width="166" height="42" rx="6" fill="#164465"/><text x="30" y="196" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Alerts</text><text x="30" y="246" fill="#b1c2d1" font-family="Arial,sans-serif" font-size="17">Hunt</text><text x="30" y="291" fill="#b1c2d1" font-family="Arial,sans-serif" font-size="17">Hosts</text><text x="30" y="336" fill="#b1c2d1" font-family="Arial,sans-serif" font-size="17">Network</text><text x="30" y="381" fill="#b1c2d1" font-family="Arial,sans-serif" font-size="17">Cases</text>
  <text x="224" y="103" fill="#f0f5fa" font-family="Arial,sans-serif" font-size="28" font-weight="700">Alert review</text><text x="224" y="132" fill="#93a9bd" font-family="Arial,sans-serif" font-size="15">Start with the alert details; keep an open mind until you verify the evidence.</text>
  <rect x="220" y="157" width="1028" height="245" rx="9" fill="#0e2234" stroke="#28445c"/><text x="244" y="190" fill="#dce8f3" font-family="Arial,sans-serif" font-size="16" font-weight="700">RECENT ALERTS</text><text x="244" y="226" fill="#819ab0" font-family="Arial,sans-serif" font-size="13">SEVERITY</text><text x="375" y="226" fill="#819ab0" font-family="Arial,sans-serif" font-size="13">ALERT</text><text x="720" y="226" fill="#819ab0" font-family="Arial,sans-serif" font-size="13">SOURCE HOST</text><text x="940" y="226" fill="#819ab0" font-family="Arial,sans-serif" font-size="13">FIRST SEEN</text>
  <rect x="236" y="242" width="994" height="55" rx="5" fill="#19364d" stroke="#dcae42" stroke-width="2"/><rect x="252" y="257" width="94" height="26" rx="13" fill="#793d37"/><text x="273" y="275" fill="#ffd3c9" font-family="Arial,sans-serif" font-size="14" font-weight="700">HIGH</text><text x="375" y="276" fill="#f2f6fa" font-family="Arial,sans-serif" font-size="16" font-weight="700">Unusual PowerShell network activity</text><text x="720" y="276" fill="#f2f6fa" font-family="Arial,sans-serif" font-size="15">WS-FIN-07</text><text x="940" y="276" fill="#f2f6fa" font-family="Arial,sans-serif" font-size="15">09:14:22 UTC</text>
  <path d="M248 315h960M248 356h960" stroke="#263e53"/><text x="270" y="342" fill="#b2c2d0" font-family="Arial,sans-serif" font-size="15">Medium  ·  New external destination</text><text x="270" y="383" fill="#b2c2d0" font-family="Arial,sans-serif" font-size="15">Low  ·  Unusual DNS query volume</text>
  <rect x="220" y="422" width="1028" height="256" rx="9" fill="#0e2234" stroke="#28445c"/><text x="244" y="458" fill="#dce8f3" font-family="Arial,sans-serif" font-size="16" font-weight="700">SELECTED ALERT DETAILS</text><text x="246" y="500" fill="#829ab0" font-family="Arial,sans-serif" font-size="13">SOURCE HOST</text><text x="246" y="525" fill="#f0f5fa" font-family="Arial,sans-serif" font-size="17" font-weight="700">WS-FIN-07 · 10.10.20.47</text><text x="600" y="500" fill="#829ab0" font-family="Arial,sans-serif" font-size="13">ALERT TIME</text><text x="600" y="525" fill="#f0f5fa" font-family="Arial,sans-serif" font-size="17" font-weight="700">09:14:22 UTC · 14 Oct</text><text x="246" y="574" fill="#829ab0" font-family="Arial,sans-serif" font-size="13">DETECTION REASON</text><text x="246" y="601" fill="#c6d4e0" font-family="Arial,sans-serif" font-size="16">PowerShell process connected to a destination not commonly seen in this group.</text><text x="246" y="636" fill="#829ab0" font-family="Arial,sans-serif" font-size="14">The alert is a starting point. Validate the activity before deciding it is malicious.</text>
  <rect x="876" y="78" width="348" height="53" rx="8" fill="#372d19" stroke="#ffcc4d" stroke-width="2"/><circle cx="901" cy="104" r="15" fill="#ffcc4d"/><text x="897" y="110" fill="#14202a" font-family="Arial,sans-serif" font-size="16" font-weight="700">1</text><text x="925" y="110" fill="#fff0c4" font-family="Arial,sans-serif" font-size="16" font-weight="700">Check severity and alert reason</text><path d="M1000 132 329 256" fill="none" stroke="#ffcc4d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="844" y="326" width="376" height="53" rx="8" fill="#372d19" stroke="#ffcc4d" stroke-width="2"/><circle cx="869" cy="352" r="15" fill="#ffcc4d"/><text x="865" y="358" fill="#14202a" font-family="Arial,sans-serif" font-size="16" font-weight="700">2</text><text x="893" y="358" fill="#fff0c4" font-family="Arial,sans-serif" font-size="16" font-weight="700">Carry host and time into your hunt</text><path d="M900 379 764 508" fill="none" stroke="#ffcc4d" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
