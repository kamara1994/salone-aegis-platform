  <text x="224" y="103" fill="#f0f5fa" font-family="Arial,sans-serif" font-size="28" font-weight="700">Build a focused search</text><text x="224" y="132" fill="#93a9bd" font-family="Arial,sans-serif" font-size="15">Translate the lead into a question that the available data can answer.</text>
