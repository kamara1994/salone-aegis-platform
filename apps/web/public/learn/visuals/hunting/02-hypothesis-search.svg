<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Hunting step 2: hypothesis and search scope</title><desc id="desc">Simulated hunt query screen. Callouts point to the question being tested and the bounded time range.</desc>
