  <rect x="246" y="569" width="962" height="34" rx="5" fill="#10283a"/><text x="264" y="591" fill="#a9bdce" font-family="Arial,sans-serif" font-size="14">Do not isolate a host based on a single unfamiliar process; correlate and follow response policy.</text>
