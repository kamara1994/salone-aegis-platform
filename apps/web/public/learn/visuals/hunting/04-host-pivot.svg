<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Hunting step 4: pivot to endpoint evidence</title><desc id="desc">Simulated endpoint investigation screen. Callouts point to the process and its parent, and to the matching outbound connection.</desc>
