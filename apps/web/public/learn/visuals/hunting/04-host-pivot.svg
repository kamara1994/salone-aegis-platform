  <text x="224" y="103" fill="#f0f5fa" font-family="Arial,sans-serif" font-size="28" font-weight="700">Pivot to the endpoint</text><text x="224" y="132" fill="#93a9bd" font-family="Arial,sans-serif" font-size="15">Use the same host and time window to find which process made the connection.</text>
  <rect x="220" y="158" width="1028" height="465" rx="9" fill="#0e2234" stroke="#28445c"/><rect x="242" y="178" width="984" height="58" rx="6" fill="#17364c"/><text x="264" y="203" fill="#829ab0" font-family="Arial,sans-serif" font-size="12">HOST</text><text x="264" y="224" fill="#f0f5fa" font-family="Arial,sans-serif" font-size="16" font-weight="700">WS-FIN-07 · 10.10.20.47</text><text x="572" y="203" fill="#829ab0" font-family="Arial,sans-serif" font-size="12">TIME WINDOW</text><text x="572" y="224" fill="#f0f5fa" font-family="Arial,sans-serif" font-size="16">09:10–09:20 UTC</text><text x="920" y="203" fill="#829ab0" font-family="Arial,sans-serif" font-size="12">DATA SOURCE</text><text x="920" y="224" fill="#f0f5fa" font-family="Arial,sans-serif" font-size="16">Endpoint process + network</text>
